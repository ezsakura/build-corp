name: Build and publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/ezsakura/build-corp-backend:latest

      - name: Build and push backend migration image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: build
          push: true
          tags: ghcr.io/ezsakura/build-corp-backend-migrate:latest

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-client
          push: true
          tags: ghcr.io/ezsakura/build-corp-client:latest

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-admin
          push: true
          tags: ghcr.io/ezsakura/build-corp-admin:latest
