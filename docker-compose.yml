services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildcorp}
      POSTGRES_USER: ${POSTGRES_USER:-buildcorp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: &backend-environment
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-buildcorp}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-buildcorp}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploaded-media:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 10s

  migrate:
    build:
      context: ./backend
      target: build
    restart: "no"
    command: ["npm", "run", "db:deploy"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    restart: "no"
    command: ["npm", "run", "db:seed"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: ./frontend-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./frontend-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client
      - admin

volumes:
  postgres-data:
  uploaded-media:
  caddy-data:
  caddy-config: